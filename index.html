<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スコア計算ツール</title>
<script src="https://unpkg.com/tesseract.js@v5.1.1/dist/tesseract.min.js"></script>
<style>
  :root{
    --pink:#ff6fa5;
    --yellow:#f5b400;
    --white:#9aa0a6;
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#2b2b33;
    --sub:#767b8a;
    --accent:#3f6fd1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:16px;
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }
  h1{ font-size:18px; margin:0 0 4px; }
  p.desc{ font-size:12px; color:var(--sub); margin:0 0 16px; }
  .card{
    background:var(--card);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 1px 4px rgba(0,0,0,0.06);
  }
  .card h2{
    font-size:14px;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .badge{
    display:inline-block;
    width:20px;height:20px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:12px;
    text-align:center;
    line-height:20px;
    flex:none;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    gap:8px;
  }
  .row:last-child{margin-bottom:0;}
  .row label{ font-size:13px; color:var(--text); flex:1; }
  .row input{
    width:110px;
    padding:8px 10px;
    border:1px solid #dcdfe6;
    border-radius:8px;
    font-size:14px;
    text-align:right;
  }
  .swatch{
    display:inline-block;
    width:12px;height:12px;
    border-radius:3px;
    margin-right:6px;
    vertical-align:middle;
  }
  .stat-hint{
    font-size:11px;
    color:var(--sub);
    margin-top:-4px;
    margin-bottom:10px;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
  }
  .total-card{
    background:linear-gradient(135deg,#3f6fd1,#6f8ef0);
    color:#fff;
    text-align:center;
    padding:20px;
  }
  .total-card .label{ font-size:13px; opacity:.9; margin-bottom:4px; }
  .total-card .value{ font-size:32px; font-weight:700; letter-spacing:.5px; }
  .breakdown{
    margin-top:14px;
    font-size:12px;
    line-height:1.9;
    border-top:1px solid rgba(255,255,255,0.25);
    padding-top:10px;
    text-align:left;
  }
  .breakdown .line{ display:flex; justify-content:space-between; }
  .note{ font-size:11px; color:var(--sub); margin-top:8px; line-height:1.6; }
  .reset-btn{
    display:block;
    width:100%;
    padding:10px;
    margin-top:4px;
    background:#fff;
    border:1px solid #dcdfe6;
    border-radius:10px;
    font-size:13px;
    color:var(--sub);
  }
  .file-row{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  input[type=file]{
    font-size:13px;
  }
  .action-btn{
    padding:11px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
  }
  .action-btn:disabled{
    background:#b7c3e0;
  }
  #ocrStatus{
    font-size:12px;
    color:var(--accent);
    min-height:16px;
  }
  #previewWrap{
    margin-top:8px;
  }
  #previewImg{
    max-width:100%;
    border-radius:8px;
    display:none;
  }
</style>
</head>
<body>

<h1>スコア計算ツール</h1>
<p class="desc">評価点、ステータス、各スキル数、１着レース数を入力すると自動で計算結果が出ます。</p>

<div class="card">
  <h2><span class="badge">0</span>画像から自動入力</h2>
  <div class="file-row">
    <input type="file" id="imgInput" accept="image/*" multiple>
    <button class="action-btn" id="readBtn" onclick="autoRead()">ここをタップ</button>
    <div id="ocrStatus"></div>
    <div id="previewWrap"></div>
  </div>
  <canvas id="hiddenCanvas" style="display:none;"></canvas>
  <div class="note">
    ・精度向上に努めてはおりますが、精度が安定しておりません。<br>
    必ず出力された内容と画像を見比べて修正してください。<br>
    ・固有スキルは自動で除外されます。<br>
    ・キャラによっては髪の色などを誤認識することがあるためこちらもご確認をお願いします。
  </div>
</div>

<div class="card">
  <h2><span class="badge">①</span>評価点</h2>
  <div class="row">
    <label>評価点</label>
    <input type="number" id="evalScore" value="0">
  </div>
</div>

<div class="card">
  <h2><span class="badge">②</span>ステータス</h2>
  <div class="row"><label>スピード</label><input type="number" class="stat" id="stat1" value="0"></div>
  <div class="row"><label>スタミナ</label><input type="number" class="stat" id="stat2" value="0"></div>
  <div class="row"><label>パワー</label><input type="number" class="stat" id="stat3" value="0"></div>
  <div class="row"><label>根性</label><input type="number" class="stat" id="stat4" value="0"></div>
  <div class="row"><label>賢さ</label><input type="number" class="stat" id="stat5" value="0"></div>
</div>

<div class="card">
  <h2><span class="badge">③</span>スキル</h2>
  <div class="row">
    <label><span class="swatch" style="background:var(--pink)"></span>進化スキル</label>
    <input type="number" id="skillPink" value="0">
  </div>
  <div class="row">
    <label><span class="swatch" style="background:var(--yellow)"></span>レアスキル</label>
    <input type="number" id="skillYellow" value="0">
  </div>
  <div class="row">
    <label><span class="swatch" style="background:var(--white);border:1px solid #ccc"></span>白スキル</label>
    <input type="number" id="skillWhite" value="0">
  </div>
  <div class="note">※固有スキルはここに含めません。進化継承、大逃げは含みます。</div>
</div>

<div class="card">
  <h2><span class="badge">④</span>レース成績(1着のみ)</h2>
  <div class="grid2">
    <div class="row"><label>GI</label><input type="number" id="raceGI" value="0"></div>
    <div class="row"><label>GII</label><input type="number" id="raceGII" value="0"></div>
    <div class="row"><label>GIII</label><input type="number" id="raceGIII" value="0"></div>
    <div class="row"><label>OP</label><input type="number" id="raceOP" value="0"></div>
  </div>
  <div class="note">OPレースはPre-OPレースも含めた数を入力してください。</div>
</div>

<div class="card total-card">
  <div class="label">合計スコア</div>
  <div class="value" id="totalValue">0</div>
  <div class="breakdown" id="breakdown"></div>
</div>

<button class="reset-btn" onclick="location.reload()">入力をリセット</button>

<script>
/* ===================== スコア計算 ===================== */
function statScore(v){
  let s = 0;
  if (v >= 1000) s += 3000;
  if (v >= 1201) s += 2000;
  if (v >= 2001) s += 1000;
  return s;
}
function num(id){
  const v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? 0 : v;
}
function calc(){
  const evalScore = num('evalScore');
  const stats = ['stat1','stat2','stat3','stat4','stat5'].map(num);
  const statTotal = stats.map(statScore).reduce((a,b)=>a+b,0);

  const pink = num('skillPink'), yellow = num('skillYellow'), white = num('skillWhite');
  const skillTotal = pink*1500 + yellow*1200 + white*400;

  const gi = num('raceGI'), gii = num('raceGII'), giii = num('raceGIII'), op = num('raceOP');
  const raceTotal = gi*100 + gii*70 + giii*50 + op*20;

  const total = evalScore + statTotal + skillTotal + raceTotal;

  document.getElementById('totalValue').textContent = Math.round(total).toLocaleString();
  document.getElementById('breakdown').innerHTML = `
    <div class="line"><span>評価点</span><span>${Math.round(evalScore).toLocaleString()}</span></div>
    <div class="line"><span>ステータス合計</span><span>${statTotal.toLocaleString()}</span></div>
    <div class="line"><span>スキル合計</span><span>${skillTotal.toLocaleString()}</span></div>
    <div class="line"><span>レース合計</span><span>${raceTotal.toLocaleString()}</span></div>
  `;
}
document.querySelectorAll('input').forEach(el => el.addEventListener('input', calc));

/* ===================== 画像自動読み取り ===================== */
function setStatus(msg){
  document.getElementById('ocrStatus').textContent = msg;
}

function loadImageFile(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, s=0, l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d + (g<b?6:0); break;
      case g: h=(b-r)/d + 2; break;
      case b: h=(r-g)/d + 4; break;
    }
    h*=60;
  }
  return {h,s,l};
}

function getPixel(imgData, x, y){
  x = Math.max(0, Math.min(imgData.width-1, Math.round(x)));
  y = Math.max(0, Math.min(imgData.height-1, Math.round(y)));
  const idx = (y*imgData.width + x)*4;
  return [imgData.data[idx], imgData.data[idx+1], imgData.data[idx+2]];
}

function classifyPixel(r,g,b){
  const {h,s,l} = rgbToHsl(r,g,b);
  // 彩度がほぼ0の部分は行と行の間の余白なので、スキルの色として扱わない
  if (s < 0.15) return 'other';
  if (h >= 220 && h <= 260 && s <= 0.45 && l >= 0.65 && l <= 0.90) return 'white';
  if (h >= 300 && h <= 350 && s >= 0.35 && l >= 0.55 && l <= 0.90) return 'pink';
  if (h >= 20 && h <= 55 && s >= 0.35 && l >= 0.45 && l <= 0.92) return 'yellow';
  return 'other';
}


// 指定した列(x座標)を縦にスキャンし、色の帯(=スキル1個分)を数える(直近数サンプルの多数決でノイズを抑制)
function scanSkillColumn(imgData, xCenter, yStart, yEnd, minBlockPx){
  const results = [];
  const step = 3;
  const windowSize = 3;
  let history = [];
  let current = null, currentStart = null;
  for (let y = yStart; y < yEnd; y += step){
    // 行と行の余白と背景色がはっきり分かれる位置を狙っているので、ごく狭い範囲だけ見れば十分
    const offsets = [-2, 0, 2];
    const samples = offsets.map(dx => getPixel(imgData, xCenter+dx, y));
    const votes = {};
    samples.forEach(([r,g,b]) => {
      const c = classifyPixel(r,g,b);
      votes[c] = (votes[c]||0) + 1;
    });
    const cls = Object.keys(votes).reduce((a,b)=> votes[a] >= votes[b] ? a : b);

    history.push(cls);
    if (history.length > windowSize) history.shift();
    const voteCounts = {};
    history.forEach(c => voteCounts[c] = (voteCounts[c]||0) + 1);
    const stableCls = Object.keys(voteCounts).reduce((a,b)=> voteCounts[a] >= voteCounts[b] ? a : b);

    if (stableCls !== current){
      if (current && current !== 'other' && (y - currentStart) >= minBlockPx){
        results.push(current);
      }
      current = stableCls;
      currentStart = y;
    }
  }
  if (current && current !== 'other' && (yEnd - currentStart) >= minBlockPx){
    results.push(current);
  }
  return results;
}

// OCR用に画像を拡大+グレースケール化+コントラスト強調する(色判定用の元画像には手を加えない)
function preprocessForOCR(sourceCanvas){
  const targetW = Math.min(Math.max(sourceCanvas.width, 1400), 2600);
  const scale = targetW / sourceCanvas.width;
  const out = document.createElement('canvas');
  out.width = Math.round(sourceCanvas.width * scale);
  out.height = Math.round(sourceCanvas.height * scale);
  const octx = out.getContext('2d');
  octx.drawImage(sourceCanvas, 0, 0, out.width, out.height);
  const id = octx.getImageData(0, 0, out.width, out.height);
  const d = id.data;
  const contrast = 1.35;
  for (let i=0; i<d.length; i+=4){
    let gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    gray = (gray - 128) * contrast + 128;
    gray = gray < 0 ? 0 : gray > 255 ? 255 : gray;
    d[i] = d[i+1] = d[i+2] = gray;
  }
  octx.putImageData(id, 0, 0);
  return { canvas: out, scale };
}

function normalizeGrade(t){
  t = t.toUpperCase().replace(/[^A-Z0-9]/g,'');
  // OCRでよくある誤読(O→0, I→1/l, 全角紛れ)もある程度吸収する
  if (['G1','GI','G I','GT','G7'].includes(t)) return 'GI';
  if (['G2','GII','G11','GN'].includes(t)) return 'GII';
  if (['G3','GIII','G111','GIN','GNI'].includes(t)) return 'GIII';
  if (t === 'OP' || t === '0P') return 'OP';
  return null;
}

// ラベル文字が正しく読めなくても、数字さえ読めていれば復元できるようにする保険:
// 画像上部で「純粋な数字の単語が横一列に並んでいる行」を探し、左から順に5ステータスとみなす
function extractStatsPositional(words, W, H){
  const candidates = words.filter(w => /^\d{2,5}$/.test(w.text.trim()) && w.bbox.y0 < H*0.45);
  const yTol = H * 0.02;
  const rows = [];
  for (const w of candidates){
    const wy = (w.bbox.y0 + w.bbox.y1)/2;
    let row = rows.find(r => Math.abs(r.y - wy) <= yTol);
    if (!row){ row = {y: wy, items: []}; rows.push(row); }
    row.items.push(w);
  }
  rows.sort((a,b) => b.items.length - a.items.length);
  const best = rows[0];
  if (!best || best.items.length < 3) return null; // 3個未満では信頼できないので諦める
  const sorted = best.items.slice().sort((a,b) => a.bbox.x0 - b.bbox.x0);
  return sorted.slice(0, 5).map(w => parseNumStr(w.text));
}

// 「スキル」タブの文字が見つかった位置の背景が実際に緑色(アクティブ)かどうかを確認する
function isGreenish(r,g,b){
  const {h,s,l} = rgbToHsl(r,g,b);
  return h >= 65 && h <= 165 && s > 0.2 && l > 0.25 && l < 0.8;
}
function isSkillTabActive(imgData, line, scale){
  const x0 = line.bbox.x0 / scale;
  const x1 = line.bbox.x1 / scale;
  const y = ((line.bbox.y0 + line.bbox.y1)/2) / scale;
  // 「スキル」は3つ並ぶタブのうち一番左と仮定し、そのあたりを複数点サンプリングする
  const sampleXs = [x0 + (x1-x0)*0.08, x0 + (x1-x0)*0.15, x0 + (x1-x0)*0.22];
  return sampleXs.some(sx => {
    const [r,g,b] = getPixel(imgData, sx, y);
    return isGreenish(r,g,b);
  });
}

function isRaceTabActive(imgData, line, scale){
  const x0 = line.bbox.x0 / scale;
  const x1 = line.bbox.x1 / scale;
  const y = ((line.bbox.y0 + line.bbox.y1)/2) / scale;
  // 「育成情報」は3つ並ぶタブのうち一番右と仮定してサンプリングする
  const sampleXs = [x0 + (x1-x0)*0.78, x0 + (x1-x0)*0.85, x0 + (x1-x0)*0.92];
  return sampleXs.some(sx => {
    const [r,g,b] = getPixel(imgData, sx, y);
    return isGreenish(r,g,b);
  });
}

// レースのグレードバッジの色を判定する(実機のバッジ色を測定して較正した値)
function classifyBadgeColor(r,g,b){
  const {h,s,l} = rgbToHsl(r,g,b);
  if (h >= 195 && h <= 230 && s >= 0.55 && l >= 0.40 && l <= 0.70) return 'GI';
  if (h >= 325 && h <= 355 && s >= 0.60 && l >= 0.45 && l <= 0.80) return 'GII';
  if (h >= 110 && h <= 150 && s >= 0.35 && l >= 0.40 && l <= 0.75) return 'GIII';
  // OP(オレンジ)。EXランクもほぼ同じ色のため、呼び出し側でEXらしき出現位置を除外する
  if (h >= 28 && h <= 52 && s >= 0.80 && l >= 0.45 && l <= 0.85) return 'OP';
  return 'other';
}

// 「1着」メダルの金色かどうかを判定する(2着以下は青系の色になる)
function classifyMedalGold(r,g,b){
  const {h,s,l} = rgbToHsl(r,g,b);
  return s >= 0.7 && h >= 20 && h <= 55 && l >= 0.55 && l <= 0.85;
}

// グレードバッジの列を縦にスキャンし、見つかった行について同じ高さのメダル色を確認して「1着」だけ数える
// バッジ列は画像の余白の取り方次第で位置が微妙にずれるため、候補位置を複数チェックする
function classifyBadgeAt(imgData, W, y, fractions){
  for (const f of fractions){
    const [r,g,b] = getPixel(imgData, W*f, y);
    const cls = classifyBadgeColor(r,g,b);
    if (cls !== 'other') return cls;
  }
  return 'other';
}
function isGoldMedalAt(imgData, W, y, fractions){
  for (const f of fractions){
    const [r,g,b] = getPixel(imgData, W*f, y);
    if (classifyMedalGold(r,g,b)) return true;
  }
  return false;
}

function scanRaceBadges(imgData, W, yStart, yEnd, cooldownPx, medalWindowPx){
  const results = {GI:0, GII:0, GIII:0, OP:0};
  const badgeFractions = [0.045,0.055,0.065,0.075,0.085,0.095,0.105];
  const medalFractions = [0.80,0.83,0.86,0.89,0.92];
  const step = 3;
  let y = yStart;
  let cooldownUntil = -1;
  let seenGradedRace = false; // GI/GII/GIIIが一度でも出てきたか
  while (y < yEnd){
    if (y >= cooldownUntil){
      const cls = classifyBadgeAt(imgData, W, y, badgeFractions);
      if (cls !== 'other'){
        // EXランクはOPと同じ色で、一覧の先頭にまとまって出る傾向があるため、
        // GI/GII/GIIIがまだ一度も出ていない時点のOP判定はEXの可能性が高いとみなして除外する
        const isSuspectedEx = (cls === 'OP' && !seenGradedRace);
        if (cls === 'GI' || cls === 'GII' || cls === 'GIII') seenGradedRace = true;
        if (!isSuspectedEx){
          const isGold = Array.from({length: Math.ceil(medalWindowPx/5)}, (_, i) => y + i*5)
            .some(yy => yy < yEnd && isGoldMedalAt(imgData, W, yy, medalFractions));
          if (isGold) results[cls]++;
        }
        cooldownUntil = y + cooldownPx;
      }
    }
    y += step;
  }
  return results;
}


// ラベルの「右隣」または「真下(別の行)」のどちらのレイアウトでも数値を拾えるようにする
function findNearestNumber(words, labelWord, W, H){
  const lx = (labelWord.bbox.x0 + labelWord.bbox.x1)/2;
  const ly1 = labelWord.bbox.y1; // ラベル下端
  const ly0 = labelWord.bbox.y0;
  const lyc = (ly0+ly1)/2;
  const maxDxAbs = W * 0.18;
  const maxDyBelow = H * 0.07;
  const maxDyRight = H * 0.03;

  let best=null, bestScore=Infinity;
  for (const w of words){
    if (w === labelWord) continue;
    const t = w.text.trim();
    if (!/^\d{2,5}$/.test(t)) continue; // 純粋な2〜5桁の数字のみ(ランクアイコンの文字混じりは除外)

    const wx = (w.bbox.x0 + w.bbox.x1)/2;
    const wyc = (w.bbox.y0 + w.bbox.y1)/2;

    // パターンA: ラベルの右隣、ほぼ同じ行
    const dxRight = w.bbox.x0 - labelWord.bbox.x1;
    const dyRight = Math.abs(wyc - lyc);
    if (dxRight >= -10 && dxRight <= maxDxAbs*1.4 && dyRight <= maxDyRight){
      const score = dxRight * 0.5 + dyRight;
      if (score < bestScore){ bestScore = score; best = w; }
      continue;
    }

    // パターンB: ラベルの真下(別の行)、x位置が近い
    const dxCol = Math.abs(wx - lx);
    const dyBelow = wyc - ly1;
    if (dyBelow >= -5 && dyBelow <= maxDyBelow && dxCol <= maxDxAbs){
      const score = dxCol + dyBelow * 0.8;
      if (score < bestScore){ bestScore = score; best = w; }
    }
  }
  return best;
}

// 1枚の画像を解析して結果オブジェクトを返す
async function analyzeImage(file, index, total){
  const img = await loadImageFile(file);

  // プレビューに追加
  const previewWrap = document.getElementById('previewWrap');
  const thumb = document.createElement('img');
  thumb.src = img.src;
  thumb.style.maxWidth = '31%';
  thumb.style.marginRight = '2%';
  thumb.style.borderRadius = '8px';
  thumb.style.display = 'inline-block';
  previewWrap.appendChild(thumb);

  const canvas = document.getElementById('hiddenCanvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); // 色判定用(元画像のまま)
  const W = canvas.width, H = canvas.height;

  // OCR用に拡大+グレースケール+コントラスト強調した画像を別途作る
  const { canvas: ocrCanvas, scale } = preprocessForOCR(canvas);
  const OW = ocrCanvas.width, OH = ocrCanvas.height;

  const { data } = await Tesseract.recognize(ocrCanvas, 'jpn+eng', {
    logger: m => {
      if (m.status === 'recognizing text'){
        setStatus(`(${index+1}/${total}枚目) 文字を読み取り中… ${Math.round((m.progress||0)*100)}%`);
      } else {
        setStatus(`(${index+1}/${total}枚目) ${m.status}`);
      }
    }
  });

  const words = data.words || [];
  const lines = data.lines || [];
  const result = {
    evalScore: 0,
    stats: {stat1:0, stat2:0, stat3:0, stat4:0, stat5:0},
    race: {GI:0, GII:0, GIII:0, OP:0},
    skill: {pink:0, yellow:0, white:0}
  };

  // 以降、words/linesの座標はOCR画像(拡大後)基準なので、しきい値もOCR画像サイズ(OW,OH)を使う

  // --- 評価点 ---
  const evalCandidates = words.filter(w =>
    /^\d{1,3},\d{3}$/.test(w.text.trim()) && w.bbox.y0 < OH*0.35
  );
  if (evalCandidates.length){
    result.evalScore = parseNumStr(evalCandidates[0].text);
  }

  // --- ステータス(まずラベル一致を試み、ダメなら数字の並びから位置的に推定) ---
  const statLabelMap = [
    {id:'stat1', patterns:['スピード']},
    {id:'stat2', patterns:['スタミナ']},
    {id:'stat3', patterns:['パワー']},
    {id:'stat4', patterns:['根性']},
    {id:'stat5', patterns:['賢さ','賢']}
  ];
  for (const s of statLabelMap){
    const labelWord = words.find(w => s.patterns.some(p => w.text.includes(p)));
    if (labelWord){
      const valWord = findNearestNumber(words, labelWord, OW, OH);
      if (valWord){
        result.stats[s.id] = parseNumStr(valWord.text);
      }
    }
  }
  // ラベル一致で埋まらなかった場合の保険(数字5個が横並びの行を左から順に割り当て)
  if (Object.values(result.stats).some(v => v === 0)){
    const pos = extractStatsPositional(words, OW, OH);
    if (pos && pos.length === 5){
      const keys = ['stat1','stat2','stat3','stat4','stat5'];
      keys.forEach((k,i) => { if (result.stats[k] === 0) result.stats[k] = pos[i]; });
    }
  }

  // --- レース成績(グレードバッジの色 + 「1着」メダルの色で判定) ---
  // OCRでの文字認識(GI/GII/GIII)は誤読が多いため、実機の色を測定して色判定に切り替えた
  const skillTabLine = lines.find(ln => ln.text.replace(/\s/g,'').includes('スキル'));
  const raceTabLine = lines.find(ln => ln.text.replace(/\s/g,'').includes('育成情報'));
  const raceTabActive = raceTabLine ? isRaceTabActive(imgData, raceTabLine, scale) : false;

  let raceYStart = null;
  let requireMinRaceHits = false;
  if (raceTabLine && raceTabActive){
    raceYStart = (raceTabLine.bbox.y1 / scale) + 15;
  } else if (!raceTabLine && !skillTabLine){
    // タブの文字が見つからない = レース履歴だけを切り抜いた画像かもしれない
    raceYStart = H * 0.01;
    requireMinRaceHits = true;
  }

  if (raceYStart !== null){
    const cooldownPx = Math.max(20, H * 0.010);
    const medalWindowPx = Math.max(60, H * 0.045);
    const raceCounts = scanRaceBadges(imgData, W, raceYStart, H * 0.99, cooldownPx, medalWindowPx);
    const totalHits = raceCounts.GI + raceCounts.GII + raceCounts.GIII + raceCounts.OP;
    if (!requireMinRaceHits || totalHits >= 1){
      result.race.GI += raceCounts.GI;
      result.race.GII += raceCounts.GII;
      result.race.GIII += raceCounts.GIII;
      result.race.OP += raceCounts.OP;
    }
  }

  // --- スキル背景色 ---
  // 「スキル」タブの文字が見つかっても、実際にアクティブ(緑色)でなければスキル一覧はこの画像に写っていないので無視する
  const raceKeywordsFound = raceTabLine || (result.race.GI+result.race.GII+result.race.GIII+result.race.OP) > 0;

  let skillYStart = null;
  let requireMinBlocks = false;

  if (skillTabLine && isSkillTabActive(imgData, skillTabLine, scale)){
    // タブが見つかり、かつアクティブ:その直下から一覧が始まる
    skillYStart = (skillTabLine.bbox.y1 / scale) + 15;
  } else if (!skillTabLine && !raceKeywordsFound){
    // タブの文字が全く見つからない = スキル一覧だけを切り抜いた画像の可能性
    // (レースのグレード文字が見つかる場合はレース画像とみなしスキップ)
    skillYStart = H * 0.01;
    requireMinBlocks = true; // 誤検出防止のため、十分な数のブロックが見つかった時だけ採用する
  }

  if (skillYStart !== null){
    const yEnd = H * 0.98;
    // スキル名の文字やアイコンにかぶらない、列の右寄りの安全地帯をピンポイントで狙う
    const leftX = W * 0.430;
    const rightX = W * 0.935;
    const minBlockPx = Math.max(15, H * 0.010);
    const leftRows = scanSkillColumn(imgData, leftX, skillYStart, yEnd, minBlockPx);
    const rightRows = scanSkillColumn(imgData, rightX, skillYStart, yEnd, minBlockPx);
    const all = [...leftRows, ...rightRows];
    if (!requireMinBlocks || all.length >= 6){
      all.forEach(c => { if (result.skill[c] !== undefined) result.skill[c]++; });
    }
  }

  return result;
}

async function autoRead(){
  const fileInput = document.getElementById('imgInput');
  const files = Array.from(fileInput.files || []);
  if (!files.length){
    setStatus('画像を選択してください');
    return;
  }
  const btn = document.getElementById('readBtn');
  btn.disabled = true;
  document.getElementById('previewWrap').innerHTML = '';

  // 解析結果をまとめるための集計値(このボタンを押すたびに0からやり直す)
  const merged = {
    evalScore: 0,
    stats: {stat1:0, stat2:0, stat3:0, stat4:0, stat5:0},
    race: {GI:0, GII:0, GIII:0, OP:0},
    skill: {pink:0, yellow:0, white:0}
  };

  try{
    for (let i=0; i<files.length; i++){
      const r = await analyzeImage(files[i], i, files.length);

      // 評価点・ステータスは「まだ見つかっていなければ採用」(複数画像に同じ数値が重複表示されるため)
      if (merged.evalScore === 0 && r.evalScore > 0) merged.evalScore = r.evalScore;
      for (const key of Object.keys(merged.stats)){
        if (merged.stats[key] === 0 && r.stats[key] > 0) merged.stats[key] = r.stats[key];
      }
      // スキル・レースは画像ごとに別の一覧が写っていることが多いので合算
      for (const key of Object.keys(merged.race)) merged.race[key] += r.race[key];
      for (const key of Object.keys(merged.skill)) merged.skill[key] += r.skill[key];
    }

    document.getElementById('evalScore').value = merged.evalScore;
    document.getElementById('stat1').value = merged.stats.stat1;
    document.getElementById('stat2').value = merged.stats.stat2;
    document.getElementById('stat3').value = merged.stats.stat3;
    document.getElementById('stat4').value = merged.stats.stat4;
    document.getElementById('stat5').value = merged.stats.stat5;
    document.getElementById('skillPink').value = merged.skill.pink;
    document.getElementById('skillYellow').value = merged.skill.yellow;
    document.getElementById('skillWhite').value = merged.skill.white;
    document.getElementById('raceGI').value = merged.race.GI;
    document.getElementById('raceGII').value = merged.race.GII;
    document.getElementById('raceGIII').value = merged.race.GIII;
    document.getElementById('raceOP').value = merged.race.OP;

    calc();
    setStatus(`読み取り完了(${files.length}枚)。内容を画像と見比べて、必要に応じて数値を修正してください。`);
  } catch (err){
    console.error(err);
    setStatus('読み取りに失敗しました。手動で入力してください。');
  } finally {
    btn.disabled = false;
  }
}

function parseNumStr(text){
  const cleaned = text.replace(/[^\d]/g,'');
  return cleaned ? parseInt(cleaned,10) : 0;
}

calc();
</script>
